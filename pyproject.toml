[project]
name = "investment-strategy"
version = "0.1.0"
description = "Reproducible analytical strategy engine for Decision and Backtest flows"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0",
  "exchange-calendars==4.11.2",
  "pandas<3",
  "yfinance==0.2.65",
]

[dependency-groups]
dev = [
  "mypy>=1.11",
  "pytest>=8.0",
  "ruff>=0.6",
  "types-PyYAML>=6.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]
per-file-ignores = { "tests/**" = ["S101"] }

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_unused_configs = true

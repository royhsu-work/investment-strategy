name: Apply dispatcher parser patch

on:
  push:
    branches:
      - agent/fix-dispatch-bulleted-action-result

permissions:
  contents: write

jobs:
  patch:
    if: github.actor == 'royhsu-work'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-dispatch-bulleted-action-result
      - name: Apply exact parser correction
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/investment_strategy/scheduled_agent_runtime.py")
          text = path.read_text(encoding="utf-8")
          old = '_MESSAGE_FIELD = re.compile(r"(?m)^(Workflow|Change|Action|Result):\\s*(.+?)\\s*$")'
          new = '_MESSAGE_FIELD = re.compile(r"(?m)^(?:-\\s+)?(Workflow|Change|Action|Result):\\s*(.+?)\\s*$")'
          if text.count(old) != 1:
              raise SystemExit("expected exactly one canonical message-field parser line")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          Path(".github/workflows/apply-dispatch-parser-patch.yml").unlink()
          PY
      - name: Commit bounded correction
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/investment_strategy/scheduled_agent_runtime.py .github/workflows/apply-dispatch-parser-patch.yml
          git commit -m "fix: accept bulleted canonical action-result fields"
          git push origin HEAD:agent/fix-dispatch-bulleted-action-result

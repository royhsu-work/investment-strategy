name: Archive establish-strategy-engine

on:
  push:
    branches:
      - agent/archive-establish-strategy-engine

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install OpenSpec
        run: npm install -g @fission-ai/openspec@1.3.1

      - name: Verify change before archive
        run: |
          openspec --version
          openspec status --change establish-strategy-engine --json
          openspec validate establish-strategy-engine --type change --strict --json --no-interactive

      - name: Archive change with OpenSpec CLI
        run: openspec archive establish-strategy-engine --yes

      - name: Verify archive result
        run: |
          openspec list
          openspec validate --all --strict
          test ! -d openspec/changes/establish-strategy-engine
          test -d openspec/changes/archive/2026-08-11-establish-strategy-engine

      - name: Commit archive result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo "No archive changes produced"; exit 1; }
          git commit -m "chore(openspec): archive establish-strategy-engine"
          git push origin HEAD

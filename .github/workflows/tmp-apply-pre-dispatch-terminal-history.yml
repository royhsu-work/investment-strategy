name: Apply bounded dispatcher history repair

on:
  push:
    branches:
      - agent/fix-pre-dispatch-terminal-history

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-pre-dispatch-terminal-history
          fetch-depth: 0

      - name: Apply bounded source and regression patch
        run: |
          python - <<'PY'
          from pathlib import Path

          runtime = Path('src/investment_strategy/scheduled_agent_runtime.py')
          text = runtime.read_text(encoding='utf-8')
          old_constants = '''_TERMINAL_CLOSE_ALIGNMENT_ACTIVATED_AT = datetime(2026, 8, 20, 16, 50, 34, tzinfo=UTC)\n'''
          new_constants = '''_TERMINAL_CLOSE_ALIGNMENT_ACTIVATED_AT = datetime(2026, 8, 20, 16, 50, 34, tzinfo=UTC)\n# First default-branch deployment of the repository-owned machine dispatcher.\n# Historical terminal journals created before this boundary may retain the old\n# close-before-final-comment ordering; later history must obey terminal-aligned\n# ordering. Merge PR #144, commit b7ce952ee8dbd26760441b871d0807a2ece0c3cd.\n_MACHINE_DISPATCH_ACTIVATED_AT = datetime(2026, 8, 24, 12, 6, 8, tzinfo=UTC)\n'''
          assert text.count(old_constants) == 1
          text = text.replace(old_constants, new_constants)

          old_block = '''            if completed_at <= closed_at:\n                return True\n            return (\n                closed_at < _TERMINAL_CLOSE_ALIGNMENT_ACTIVATED_AT\n                and closed_at < completed_at < _TERMINAL_CLOSE_ALIGNMENT_ACTIVATED_AT\n            )\n'''
          new_block = '''            if completed_at <= closed_at:\n                return True\n            if (\n                closed_at < _TERMINAL_CLOSE_ALIGNMENT_ACTIVATED_AT\n                and closed_at < completed_at < _TERMINAL_CLOSE_ALIGNMENT_ACTIVATED_AT\n            ):\n                return True\n\n            updated_at, updated_valid = _github_timestamp(marker.get("updated_at"))\n            return (\n                raw_issue.get("state_reason") == "completed"\n                and updated_valid\n                and updated_at == completed_at\n                and closed_at < completed_at < _MACHINE_DISPATCH_ACTIVATED_AT\n            )\n'''
          assert text.count(old_block) == 1
          runtime.write_text(text.replace(old_block, new_block), encoding='utf-8')

          existing = Path('tests/test_pre_terminal_alignment_finalize_archive_dispatch.py')
          tests = existing.read_text(encoding='utf-8')
          tests = tests.replace(
              'def test_post_alignment_post_close_completion_does_not_clear_structurally(',
              'def test_post_machine_dispatch_post_close_completion_does_not_clear_structurally(',
          )
          tests = tests.replace(
              'historical["closed_at"] = "2026-08-21T00:00:00Z"',
              'historical["closed_at"] = "2026-08-24T12:07:00Z"',
          )
          tests = tests.replace(
              '_lifecycle_complete_25_comment(created_at="2026-08-21T00:01:00Z")',
              '_lifecycle_complete_25_comment(created_at="2026-08-24T12:08:00Z")',
          )
          existing.write_text(tests, encoding='utf-8')

          production = Path('tests/test_pre_machine_dispatch_terminal_history.py')
          production.write_text('''"""Production-shaped compatibility regressions for pre-machine-dispatch terminal history."""\n\nfrom pathlib import Path\n\nimport pytest\n\nimport investment_strategy.scheduled_agent_runtime as runtime\nimport investment_strategy.workflow_dispatch as workflow_dispatch\n\n\ndef _formal_140_payload() -> dict[str, object]:\n    return {\n        "number": 140,\n        "state": "open",\n        "body": "Change: validate-no-api-issue-comment-bridge",\n        "labels": [{"name": "agent:lead"}, {"name": "action:finalize-change"}],\n        "created_at": "2026-08-23T11:39:39Z",\n        "closed_at": None,\n    }\n\n\ndef _terminal_124_payload() -> dict[str, object]:\n    return {\n        "number": 124,\n        "state": "closed",\n        "state_reason": "completed",\n        "body": "Change: require-ci-reobservation-before-async-exit\\n",\n        "labels": [{"name": "agent:lead"}, {"name": "action:finalize-archive"}],\n        "created_at": "2026-08-21T05:56:01Z",\n        "closed_at": "2026-08-21T09:33:25Z",\n        "comments": 23,\n    }\n\n\ndef _terminal_124_comment(*, updated_at: str = "2026-08-21T09:34:08Z") -> dict[str, object]:\n    return {\n        "id": 5368139311,\n        "body": (\n            "## ACTION_RESULT\\n\\n"\n            "Workflow: #124\\n"\n            "Change: `require-ci-reobservation-before-async-exit`\\n"\n            "Action: `Lead / finalize-archive`\\n"\n            "Result: `LIFECYCLE_COMPLETE`\\n"\n            "Revision: final Archive PR #127 exact reviewed/merged head "\n            "`d9401afb2992de0b274f267040bbdde4b4f75dad`\\n"\n        ),\n        "user": {"login": "royhsu-work"},\n        "author_association": "OWNER",\n        "created_at": "2026-08-21T09:34:08Z",\n        "updated_at": updated_at,\n    }\n\n\ndef _install_pages(monkeypatch: pytest.MonkeyPatch, comment: dict[str, object]) -> None:\n    monkeypatch.setattr(\n        runtime,\n        "_github_open_issue_pages",\n        lambda repository, token: ((_formal_140_payload(),),),\n    )\n    monkeypatch.setattr(\n        runtime,\n        "_github_closed_issue_pages",\n        lambda repository, token: ((_terminal_124_payload(),),),\n    )\n\n    def structural_page(url: str, token: str) -> tuple[dict[str, object], ...]:\n        del token\n        assert url.endswith("/issues/124/comments?per_page=100&page=1")\n        return (comment,)\n\n    monkeypatch.setattr(runtime, "_github_get_list_page", structural_page)\n\n\ndef test_pre_dispatch_124_terminal_history_clears_without_archived_change_lookup(\n    monkeypatch: pytest.MonkeyPatch,\n    tmp_path: Path,\n) -> None:\n    _install_pages(monkeypatch, _terminal_124_comment())\n\n    def forbidden(*args: object, **kwargs: object) -> object:\n        raise AssertionError("proven pre-dispatch terminal history must not inspect archived Change")\n\n    monkeypatch.setattr(runtime, "_legacy_terminal_evidence_from_checkout", forbidden)\n    monkeypatch.setattr(runtime, "_github_issue_comment_pages", forbidden)\n    monkeypatch.setattr(runtime, "_github_issue", forbidden)\n\n    preflight = runtime.acquire_current_github_preflight(\n        "royhsu-work/investment-strategy",\n        "token",\n        repository_root=tmp_path,\n    )\n    decision = workflow_dispatch.classify_dispatch(preflight)\n\n    assert decision.disposition == "AUTHORIZE"\n    assert decision.selected_issue_id == 140\n    assert decision.selected_routing == ("lead", "finalize-change")\n    assert all(item.state == "open" for item in preflight.issues)\n\n\ndef test_edited_pre_dispatch_completion_does_not_gain_historical_clearance(\n    monkeypatch: pytest.MonkeyPatch,\n    tmp_path: Path,\n) -> None:\n    _install_pages(monkeypatch, _terminal_124_comment(updated_at="2026-08-24T12:07:00Z"))\n    monkeypatch.setattr(\n        runtime,\n        "_legacy_terminal_evidence_from_checkout",\n        lambda change, *, repository_root: "indeterminate",\n    )\n    monkeypatch.setattr(\n        runtime,\n        "_github_issue_comment_pages",\n        lambda repository, token, issue_number: ((),),\n    )\n\n    preflight = runtime.acquire_current_github_preflight(\n        "royhsu-work/investment-strategy",\n        "token",\n        repository_root=tmp_path,\n    )\n\n    assert workflow_dispatch.classify_dispatch(preflight).disposition == "FAIL_CLOSED"\n    assert any(item.state == "closed" for item in preflight.issues)\n''', encoding='utf-8')

          workflow = Path('.github/workflows/tmp-apply-pre-dispatch-terminal-history.yml')
          workflow.unlink()
          PY

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/investment_strategy/scheduled_agent_runtime.py \
                  tests/test_pre_terminal_alignment_finalize_archive_dispatch.py \
                  tests/test_pre_machine_dispatch_terminal_history.py \
                  .github/workflows/tmp-apply-pre-dispatch-terminal-history.yml
          git commit -m "fix: clear trusted pre-dispatch terminal history"
          git push origin HEAD:agent/fix-pre-dispatch-terminal-history

name: Scheduled Agent Dispatch Diagnostic

# Manual diagnostic only. The normal no-API Scheduled Agent path is the external
# ChatGPT Scheduled Task -> scheduled-agent-bridge.yml -> production dispatcher.
on:
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: scheduled-agent-dispatch-diagnostic-${{ github.repository }}
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out authoritative default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run read-only machine dispatch diagnostic
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PYTHONPATH: ${{ github.workspace }}/src
        run: uv run python -m investment_strategy.scheduled_agent_runtime

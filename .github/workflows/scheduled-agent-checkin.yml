name: Scheduled Agent Runtime Check-in

on:
  schedule:
    - cron: "0 16 * * *"
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: scheduled-agent-checkin-${{ github.repository }}
  cancel-in-progress: false

jobs:
  rollover:
    if: >-
      github.event_name != 'issue_comment' ||
      startsWith(github.event.comment.body, 'ROLLOVER_REQUEST')
    runs-on: ubuntu-latest
    steps:
      - name: Check out authoritative default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Establish current Asia/Taipei runtime shard
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PYTHONPATH: ${{ github.workspace }}/src
        run: uv run python -m investment_strategy.scheduled_agent_checkin

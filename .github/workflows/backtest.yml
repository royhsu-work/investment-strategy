name: Analytical Backtest

on:
  workflow_dispatch:
    inputs:
      symbol:
        description: "Target symbol"
        required: true
        type: string
      mode:
        description: "Assignment mode: ACTIVE or EXPLICIT"
        required: true
        default: "ACTIVE"
        type: choice
        options:
          - ACTIVE
          - EXPLICIT
      strategy:
        description: "Required only for EXPLICIT mode"
        required: false
        type: string
      parameter_set:
        description: "Required only for EXPLICIT mode"
        required: false
        type: string
      start_date:
        description: "Inclusive calendar interval start (ISO date)"
        required: true
        type: string
      end_date:
        description: "Inclusive calendar interval end (ISO date)"
        required: true
        type: string
  push:
    paths:
      - "requests/backtest.json"

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Analytical Backtest scaffold
        run: |
          echo "Analytical Backtest workflow scaffold."
          echo "This replays StrategyResult only; it does not simulate fills, positions, cash, PnL, returns, or drawdown."
          echo "Live provider/calendar/production-strategy composition is intentionally deferred."
          echo "Generated analytical outputs belong in GitHub Actions Artifacts, not repository commits."

name: Format fenced parser repair

on:
  push:
    branches:
      - agent/fix-fenced-change-identity-dispatch
    paths:
      - .github/workflows/format-fenced-parser.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-fenced-change-identity-dispatch
      - name: Apply formatter-equivalent source spacing
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/investment_strategy/scheduled_agent_runtime.py")
          text = path.read_text(encoding="utf-8")
          old = "    return matches\n_MESSAGE_FIELD = re.compile("
          new = "    return matches\n\n\n_MESSAGE_FIELD = re.compile("
          if text.count(old) != 1:
              raise SystemExit("unexpected formatter source anchor")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          rm .github/workflows/format-fenced-parser.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/investment_strategy/scheduled_agent_runtime.py .github/workflows/format-fenced-parser.yml
          git commit -m "Format fenced Change parser"
          git push origin HEAD:agent/fix-fenced-change-identity-dispatch

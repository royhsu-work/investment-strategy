name: OpenSpec Archive

on:
  workflow_dispatch:
    inputs:
      change:
        description: OpenSpec change name to archive
        required: true
        type: string

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    env:
      CHANGE: ${{ inputs.change }}
      TARGET_BRANCH: agent/archive-${{ inputs.change }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare archive branch
        shell: bash
        run: |
          git check-ref-format --branch "$TARGET_BRANCH"
          if git ls-remote --exit-code --heads origin "refs/heads/$TARGET_BRANCH" >/dev/null 2>&1; then
            echo "Archive branch already exists: $TARGET_BRANCH"
            exit 1
          fi
          git switch -c "$TARGET_BRANCH"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install OpenSpec
        run: npm install -g @fission-ai/openspec@1.3.1

      - name: Verify change before archive
        run: |
          openspec --version
          openspec status --change "$CHANGE" --json
          openspec validate "$CHANGE" --type change --strict --json --no-interactive

      - name: Archive change with OpenSpec CLI
        run: openspec archive "$CHANGE" --yes

      - name: Verify archive result
        run: |
          openspec list
          openspec validate --all --strict
          test ! -d "openspec/changes/$CHANGE"
          find openspec/changes/archive -maxdepth 1 -type d -name "*-$CHANGE" -print -quit | grep -q .

      - name: Commit and push archive branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No archive changes produced"; exit 1; }
          git commit -m "chore(openspec): archive $CHANGE"
          git push -u origin HEAD:"$TARGET_BRANCH"

name: OpenSpec Archive

on:
  workflow_dispatch:
    inputs:
      change:
        description: OpenSpec change name to archive
        required: true
        type: string
  push:
    branches:
      - agent/archive-establish-strategy-engine

permissions:
  contents: write

jobs:
  archive:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve archive target
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "CHANGE=${{ inputs.change }}" >> "$GITHUB_ENV"
            echo "TARGET_BRANCH=agent/archive-${{ inputs.change }}" >> "$GITHUB_ENV"
          else
            echo "CHANGE=establish-strategy-engine" >> "$GITHUB_ENV"
            echo "TARGET_BRANCH=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          fi

      - name: Prepare archive branch
        if: github.event_name == 'workflow_dispatch'
        run: git switch -c "$TARGET_BRANCH"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install OpenSpec
        run: npm install -g @fission-ai/openspec@1.3.1

      - name: Verify change before archive
        run: |
          openspec --version
          openspec status --change "$CHANGE" --json
          openspec validate "$CHANGE" --type change --strict --json --no-interactive

      - name: Archive change with OpenSpec CLI
        run: openspec archive "$CHANGE" --yes

      - name: Verify archive result
        run: |
          openspec list
          openspec validate --all --strict
          test ! -d "openspec/changes/$CHANGE"
          find openspec/changes/archive -maxdepth 1 -type d -name "*-$CHANGE" -print -quit | grep -q .

      - name: Commit archive result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No archive changes produced"; exit 1; }
          git commit -m "chore(openspec): archive $CHANGE"
          git push -u origin HEAD:"$TARGET_BRANCH"

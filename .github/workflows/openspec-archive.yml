name: OpenSpec Archive
run-name: OpenSpec Archive ${{ inputs.request_key || github.run_id }}

on:
  workflow_dispatch:
    inputs:
      change:
        description: OpenSpec change name to archive
        required: true
        type: string
      issue:
        description: Coordination Issue number for an application-authorized archive request
        required: false
        type: string
      revision:
        description: Exact default-branch revision for an application-authorized archive request
        required: false
        type: string
      request_key:
        description: Deterministic archive request identity
        required: false
        type: string
  issue_comment:
    types:
      - created
  pull_request:
    branches:
      - main
    types:
      - closed

permissions:
  contents: write
  issues: read
  pull-requests: read

concurrency:
  group: openspec-archive-${{ github.repository }}
  cancel-in-progress: false

jobs:
  archive:
    if: >-
      github.event_name != 'issue_comment' ||
      (
        github.event.issue.pull_request == null &&
        startsWith(github.event.comment.body, 'ARCHIVE_REQUEST')
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout archive evaluation snapshot
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.merged && github.event.pull_request.merge_commit_sha || (github.event_name == 'workflow_dispatch' && inputs.revision) || 'main' }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve archive candidate
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_CHANGE: ${{ inputs.change }}
          REQUEST_ISSUE: ${{ inputs.issue }}
          REQUEST_REVISION: ${{ inputs.revision }}
          REQUEST_KEY: ${{ inputs.request_key }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_BASE_REPO: ${{ github.event.pull_request.base.repo.full_name }}
          PR_RECOVERY: ${{ contains(github.event.pull_request.labels.*.name, 'openspec-archive-recovery') }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_ACTOR: ${{ github.event.comment.user.login }}
          COMMENT_ISSUE: ${{ github.event.issue.number }}
          COMMENT_REPOSITORY: ${{ github.event.repository.full_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$EVENT_NAME" == "issue_comment" ]]; then
            python .github/scripts/openspec_archive.py classify \
              --event-name "$EVENT_NAME" \
              --comment-body "$COMMENT_BODY" \
              --comment-actor "$COMMENT_ACTOR" \
              --comment-issue "$COMMENT_ISSUE" \
              --comment-repository "$COMMENT_REPOSITORY" \
              --expected-repository "$GITHUB_REPOSITORY" \
              --changes-root openspec/changes \
              >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            python .github/scripts/openspec_archive.py classify \
              --event-name "$EVENT_NAME" \
              --manual-change "$MANUAL_CHANGE" \
              --request-issue "$REQUEST_ISSUE" \
              --request-revision "$REQUEST_REVISION" \
              --request-key "$REQUEST_KEY" \
              >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_files="$RUNNER_TEMP/pr-changed-files.txt"
          : > "$changed_files"
          if [[ "$PR_MERGED" == "true" && "$PR_HEAD_REF" != agent/archive-* ]]; then
            gh api --paginate \
              -H "Accept: application/vnd.github+json" \
              "/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" \
              --jq '.[].filename' \
              > "$changed_files"
          fi

          python .github/scripts/openspec_archive.py classify \
            --event-name "$EVENT_NAME" \
            --merged "$PR_MERGED" \
            --head-ref "$PR_HEAD_REF" \
            --head-repo "$PR_HEAD_REPO" \
            --base-repo "$PR_BASE_REPO" \
            --recovery "$PR_RECOVERY" \
            --changed-files "$changed_files" \
            --changes-root openspec/changes \
            >> "$GITHUB_OUTPUT"

      - name: Verify exact archive request revision
        if: steps.classify.outputs.action == 'evaluate' && steps.classify.outputs.mode == 'request'
        env:
          REQUEST_REVISION: ${{ steps.classify.outputs.request_revision }}
        shell: bash
        run: |
          actual_sha="$(git rev-parse HEAD)"
          if [[ "$REQUEST_REVISION" != "$actual_sha" ]]; then
            echo "::error::Archive request revision $REQUEST_REVISION is stale; checked-out main is $actual_sha"
            exit 1
          fi

      - name: Verify archive request source Issue
        if: steps.classify.outputs.action == 'evaluate' && steps.classify.outputs.mode == 'request'
        env:
          CHANGE: ${{ steps.classify.outputs.change }}
          ISSUE_NUMBER: ${{ steps.classify.outputs.request_issue }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          issue_json="$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER")"
          jq -e --arg change "$CHANGE" '
            .state == "open" and
            (.pull_request == null) and
            ((.body // "") | split("\n") | index("Change: " + $change) != null)
          ' <<< "$issue_json" >/dev/null

      - name: Set up Node.js
        if: steps.classify.outputs.action == 'evaluate'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install qualified OpenSpec baseline
        if: steps.classify.outputs.action == 'evaluate'
        shell: bash
        run: |
          openspec_version="$(tr -d '[:space:]' < .github/openspec-version)"
          [[ "$openspec_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::Invalid .github/openspec-version: $openspec_version"
            exit 1
          }
          npm install -g "@fission-ai/openspec@$openspec_version"

      - name: Check change completion
        if: steps.classify.outputs.action == 'evaluate'
        id: completion
        shell: bash
        env:
          CHANGE: ${{ steps.classify.outputs.change }}
          MODE: ${{ steps.classify.outputs.mode }}
        run: |
          openspec --version
          openspec list --json > "$RUNNER_TEMP/openspec-changes.json"
          python .github/scripts/openspec_archive.py completion \
            --mode "$MODE" \
            --change "$CHANGE" \
            --list-file "$RUNNER_TEMP/openspec-changes.json" \
            >> "$GITHUB_OUTPUT"

      - name: Verify change before archive
        if: steps.completion.outputs.should_archive == 'true'
        env:
          CHANGE: ${{ steps.classify.outputs.change }}
        run: openspec validate "$CHANGE" --type change --strict --json --no-interactive

      - name: Snapshot canonical Purpose contract
        if: steps.completion.outputs.should_archive == 'true'
        env:
          CHANGE: ${{ steps.classify.outputs.change }}
        run: |
          python .github/scripts/openspec_archive.py purpose-snapshot \
            --change "$CHANGE" \
            --snapshot-file "$RUNNER_TEMP/openspec-purpose.json"

      - name: Prepare or reuse archive branch
        if: steps.completion.outputs.should_archive == 'true'
        id: branch
        env:
          CHANGE: ${{ steps.classify.outputs.change }}
        shell: bash
        run: |
          target_branch="agent/archive-$CHANGE"
          git check-ref-format --branch "$target_branch"
          if git ls-remote --exit-code --heads origin "refs/heads/$target_branch" >/dev/null 2>&1; then
            git fetch origin "refs/heads/$target_branch:refs/remotes/origin/$target_branch"
            git switch --detach "refs/remotes/origin/$target_branch"
            existing="true"
          else
            git switch -c "$target_branch"
            existing="false"
          fi
          echo "target_branch=$target_branch" >> "$GITHUB_OUTPUT"
          echo "existing=$existing" >> "$GITHUB_OUTPUT"

      - name: Archive change with OpenSpec CLI
        if: steps.completion.outputs.should_archive == 'true' && steps.branch.outputs.existing == 'false'
        env:
          CHANGE: ${{ steps.classify.outputs.change }}
        run: openspec archive "$CHANGE" --yes

      - name: Preserve and verify canonical Purpose
        if: steps.completion.outputs.should_archive == 'true' && steps.branch.outputs.existing == 'false'
        run: |
          python .github/scripts/openspec_archive.py purpose-preserve \
            --snapshot-file "$RUNNER_TEMP/openspec-purpose.json"

      - name: Verify archive result
        if: steps.completion.outputs.should_archive == 'true'
        env:
          CHANGE: ${{ steps.classify.outputs.change }}
        shell: bash
        run: |
          openspec list
          openspec validate --all --strict --json --no-interactive
          test ! -d "openspec/changes/$CHANGE"
          find openspec/changes/archive -maxdepth 1 -type d -name "*-$CHANGE" -print -quit | grep -q .

      - name: Commit and push archive branch
        if: steps.completion.outputs.should_archive == 'true' && steps.branch.outputs.existing == 'false'
        env:
          CHANGE: ${{ steps.classify.outputs.change }}
        shell: bash
        run: |
          target_branch="agent/archive-$CHANGE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No archive changes produced"; exit 1; }
          git commit -m "chore(openspec): archive $CHANGE"
          git push -u origin HEAD:"$target_branch"

      - name: Prepare non-closing Archive PR linkage
        if: steps.completion.outputs.should_archive == 'true'
        id: linkage
        env:
          CHANGE: ${{ steps.classify.outputs.change }}
          TARGET_BRANCH: ${{ steps.branch.outputs.target_branch }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          issues_file="$RUNNER_TEMP/coordination-issues.json"
          gh api --paginate \
            -H "Accept: application/vnd.github+json" \
            "/repos/$GITHUB_REPOSITORY/issues?state=all&per_page=100" \
            > "$issues_file"
          python .github/scripts/archive_pr_linkage.py resolve \
            --change "$CHANGE" \
            --issues-file "$issues_file" \
            > "$RUNNER_TEMP/archive-linkage.env"
          issue_number="$(sed -n 's/^issue_number=//p' "$RUNNER_TEMP/archive-linkage.env")"
          [[ "$issue_number" =~ ^[1-9][0-9]*$ ]] || {
            echo "::error::Archive linkage did not resolve one Issue"
            exit 1
          }
          body_file="$RUNNER_TEMP/archive-pr-body.md"
          python .github/scripts/archive_pr_linkage.py render \
            --change "$CHANGE" \
            --issue-number "$issue_number" \
            --body-file "$body_file"
          grep -Fxq "Refs #$issue_number" "$body_file"

          prs="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --state all \
            --head "$TARGET_BRANCH" \
            --base main \
            --json number,state,isDraft,mergedAt,headRefName,baseRefName,body \
            --limit 100)"
          count="$(jq 'length' <<< "$prs")"
          if [[ "$count" -gt 1 ]]; then
            echo "::error::More than one Archive PR matches $TARGET_BRANCH -> main"
            exit 1
          fi
          carrier_mode="ready-for-legal-carrier"
          if [[ "$count" == "1" ]]; then
            state="$(jq -r '.[0].state' <<< "$prs")"
            merged_at="$(jq -r '.[0].mergedAt // empty' <<< "$prs")"
            if [[ "$state" == "OPEN" ]]; then
              jq -e --arg branch "$TARGET_BRANCH" '
                .[0].isDraft == false and
                .[0].headRefName == $branch and
                .[0].baseRefName == "main"
              ' <<< "$prs" >/dev/null
              body="$(jq -r '.[0].body // ""' <<< "$prs")"
              grep -Fxq "Refs #$issue_number" <<< "$body"
              carrier_mode="reuse-open"
            elif [[ -n "$merged_at" ]]; then
              carrier_mode="already-merged"
            else
              echo "::error::Matching Archive PR is closed without a merge; recovery is not implicit"
              exit 1
            fi
          fi
          {
            echo "issue_number=$issue_number"
            echo "target_branch=$TARGET_BRANCH"
            echo "carrier_mode=$carrier_mode"
          } >> "$GITHUB_OUTPUT"

      - name: Emit exact Archive carrier handoff
        if: steps.completion.outputs.should_archive == 'true'
        env:
          CHANGE: ${{ steps.classify.outputs.change }}
          ISSUE_NUMBER: ${{ steps.linkage.outputs.issue_number }}
          TARGET_BRANCH: ${{ steps.branch.outputs.target_branch }}
          CARRIER_MODE: ${{ steps.linkage.outputs.carrier_mode }}
        shell: bash
        run: |
          head_sha="$(git rev-parse HEAD)"
          echo "archive_change=$CHANGE"
          echo "archive_issue=$ISSUE_NUMBER"
          echo "archive_branch=$TARGET_BRANCH"
          echo "archive_head_sha=$head_sha"
          echo "archive_carrier_mode=$CARRIER_MODE"
          {
            echo "### Exact Archive carrier handoff"
            echo "- Change: \`$CHANGE\`"
            echo "- Coordination Issue: \`#$ISSUE_NUMBER\`"
            echo "- Archive branch: \`$TARGET_BRANCH\`"
            echo "- Archive head: \`$head_sha\`"
            echo "- Carrier mode: \`$CARRIER_MODE\`"
          } >> "$GITHUB_STEP_SUMMARY"

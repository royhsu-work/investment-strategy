name: Python Quality

on:
  push:
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/scripts/openspec_archive.py"
      - ".github/workflows/openspec-archive.yml"
      - ".github/workflows/quality.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/scripts/openspec_archive.py"
      - ".github/workflows/openspec-archive.yml"
      - ".github/workflows/quality.yml"

permissions:
  contents: read
  issues: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Diagnose structural closed-workflow screen
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          uv run python - <<'PY'
          import os
          from investment_strategy import scheduled_agent_runtime as runtime

          repository = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]
          pages = runtime._github_closed_issue_pages(repository, token)
          raw_by_issue = runtime._raw_issue_map(pages)
          observations = runtime._normalized_closed_observations(pages)
          print(f"STRUCTURAL_DIAGNOSTIC closed_observations={len(observations)}")
          unresolved = []
          for observation in observations:
              if observation.change == "unset" or observation.routing is None:
                  continue
              raw_issue = raw_by_issue[observation.issue_number]
              cleared = runtime._structural_terminal_marker(
                  repository,
                  token,
                  raw_issue=raw_issue,
                  observation=observation,
              )
              comment_count = raw_issue.get("comments")
              marker = runtime._github_last_visible_issue_comment(
                  repository,
                  token,
                  issue_number=observation.issue_number,
                  reported_comment_count=comment_count if type(comment_count) is int else 0,
              )
              body = marker.get("body") if marker else None
              first_line = body.splitlines()[0] if isinstance(body, str) and body.splitlines() else ""
              actor = marker.get("user", {}).get("login") if marker and isinstance(marker.get("user"), dict) else None
              marker_id = marker.get("id") if marker else None
              print(
                  "STRUCTURAL_CANDIDATE "
                  f"issue={observation.issue_number} change={observation.change} "
                  f"routing={observation.routing} state_reason={raw_issue.get('state_reason')} "
                  f"comments={comment_count} cleared={cleared} marker_id={marker_id} "
                  f"marker_actor={actor} marker_first_line={first_line!r}"
              )
              if not cleared:
                  unresolved.append(observation.issue_number)
          print(f"STRUCTURAL_UNRESOLVED ids={unresolved}")
          PY
      - name: Run tests
        run: uv run pytest
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy src tests

name: Python Quality

on:
  push:
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/scripts/openspec_archive.py"
      - ".github/workflows/openspec-archive.yml"
      - ".github/workflows/quality.yml"
      - "README.md"
      - "agents/**"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/scripts/openspec_archive.py"
      - ".github/workflows/openspec-archive.yml"
      - ".github/workflows/quality.yml"
      - "README.md"
      - "agents/**"

jobs:
  quality:
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run tests
        run: uv run pytest
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy src tests
      - name: Diagnose exact T1 native artifact reads
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 437
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PYTHONPATH: ${{ github.workspace }}/src
        shell: bash
        run: |
          if [[ "$(git log -1 --format=%s)" != *"[t1-native-artifact-diagnostic]"* ]]; then
            echo '{"stage":"diagnostic-gate","classification":"SKIPPED","mutation_attempted":false}'
            exit 0
          fi
          uv run python .github/scripts/diagnose_dispatch_artifact.py

name: Python Quality

on:
  push:
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/scripts/openspec_archive.py"
      - ".github/workflows/openspec-archive.yml"
      - ".github/workflows/quality.yml"
      - "README.md"
      - "agents/**"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/scripts/openspec_archive.py"
      - ".github/workflows/openspec-archive.yml"
      - ".github/workflows/quality.yml"
      - "README.md"
      - "agents/**"

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Prove exact quality checkout
        id: quality_checkout
        shell: bash
        env:
          EXPECTED_QUALITY_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          actual_sha=$(git rev-parse HEAD)
          if [[ "$actual_sha" != "$EXPECTED_QUALITY_SHA" ]]; then
            printf 'Python Quality checkout mismatch: expected %s, got %s\n' "$EXPECTED_QUALITY_SHA" "$actual_sha" >&2
            exit 1
          fi
          printf '%s\n' \
            "quality_repository=$GITHUB_REPOSITORY" \
            "quality_target_sha=$EXPECTED_QUALITY_SHA" \
            "quality_checkout_sha=$actual_sha" \
            "quality_definition_sha=$GITHUB_WORKFLOW_SHA" \
            "quality_run_id=$GITHUB_RUN_ID" \
            "quality_run_attempt=$GITHUB_RUN_ATTEMPT"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy src tests
      - name: Run tests
        run: uv run pytest

name: Python Quality

on:
  push:
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/scripts/openspec_archive.py"
      - ".github/workflows/openspec-archive.yml"
      - ".github/workflows/quality.yml"
      - "README.md"
      - "agents/**"
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run tests
        run: uv run pytest
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy src tests

  integration:
    if: github.event_name == 'pull_request'
    name: integration ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} ${{ github.sha }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      BASE: ${{ github.event.pull_request.base.sha }}
      FEATURE: ${{ github.event.pull_request.head.sha }}
      CANDIDATE: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify tested revision and both parents
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          test "$(git show -s --format=%P HEAD)" = "$BASE $FEATURE"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify integrated tree
        run: |
          uv run --frozen pytest
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .
          uv run --frozen mypy src tests

  integration-spec:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/openspec-validate.yml
    with:
      target_revision: ${{ github.sha }}

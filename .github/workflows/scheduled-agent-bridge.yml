name: Scheduled Agent Issue Comment Bridge

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: issue-comment-bridge-${{ github.event.comment.id }}
  cancel-in-progress: false

jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - name: Check out authoritative default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Record exact checked-out default-branch revision
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Freshly read configured check-in Issue comments
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CHECKIN_ISSUE: ${{ vars.AGENT_RUNTIME_CHECKIN_ISSUE }}
        run: |
          if [[ ! "$CHECKIN_ISSUE" =~ ^[1-9][0-9]*$ ]]; then
            echo "AGENT_RUNTIME_CHECKIN_ISSUE must be a positive Issue number" >&2
            exit 1
          fi
          gh api --paginate --slurp \
            "/repos/${GITHUB_REPOSITORY}/issues/${CHECKIN_ISSUE}/comments?per_page=100" \
            > "$RUNNER_TEMP/issue-comment-pages.json"

      - name: Plan exact correlated machine dispatch decision
        id: handler
        env:
          AGENT_RUNTIME_CHECKIN_ISSUE: ${{ vars.AGENT_RUNTIME_CHECKIN_ISSUE }}
          DEFAULT_BRANCH_REVISION: ${{ steps.revision.outputs.sha }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PYTHONPATH: ${{ github.workspace }}/src
        run: >-
          uv run python -m investment_strategy.issue_comment_bridge
          --event-path "$GITHUB_EVENT_PATH"
          --comments-path "$RUNNER_TEMP/issue-comment-pages.json"
          --check-in-issue "$AGENT_RUNTIME_CHECKIN_ISSUE"
          --revision "$DEFAULT_BRANCH_REVISION"
          --github-output "$GITHUB_OUTPUT"
          --result-payload "$RUNNER_TEMP/dispatch-result.json"

      - name: Post correlated machine dispatch decision
        if: steps.handler.outputs.should_post == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ steps.handler.outputs.issue_number }}
        run: >-
          gh api --method POST
          "/repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments"
          --input "$RUNNER_TEMP/dispatch-result.json"

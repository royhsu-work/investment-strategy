name: Scheduled Agent Issue Comment Bridge

run-name: Scheduled Agent Dispatch ${{ github.event.comment.id }}

on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: read
  issues: read

concurrency:
  group: issue-comment-bridge-${{ github.event.comment.id }}
  cancel-in-progress: false

jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - name: Check out authoritative default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Record exact checked-out default-branch revision
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Plan exact correlated machine dispatch decision
        id: handler
        env:
          DEFAULT_BRANCH_REVISION: ${{ steps.revision.outputs.sha }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PYTHONPATH: ${{ github.workspace }}/src
        run: >-
          uv run python -m investment_strategy.issue_comment_bridge
          --event-path "$GITHUB_EVENT_PATH"
          --revision "$DEFAULT_BRANCH_REVISION"
          --github-output "$GITHUB_OUTPUT"
          --result-payload "$RUNNER_TEMP/dispatch-result.json"

      - name: Resume exact incomplete application before semantic dispatch
        if: steps.handler.outputs.application_resume_job_id != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RESUME_JOB_ID: ${{ steps.handler.outputs.application_resume_job_id }}
        shell: bash
        run: |
          response_code="$(curl -sS -o "$RUNNER_TEMP/application-rerun-response.json" -w '%{http_code}' \
            -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/jobs/${RESUME_JOB_ID}/rerun")"
          if [[ "$response_code" != "201" ]]; then
            cat "$RUNNER_TEMP/application-rerun-response.json" || true
            echo "::error::Exact application job rerun failed with HTTP $response_code"
            exit 1
          fi

      - name: Upload exact run-scoped machine dispatch result
        if: steps.handler.outputs.should_emit == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: dispatch-result.json
          path: ${{ runner.temp }}/dispatch-result.json
          archive: false
          if-no-files-found: error
          retention-days: 7

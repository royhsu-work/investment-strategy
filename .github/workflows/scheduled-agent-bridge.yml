name: Scheduled Agent Issue Comment Bridge

run-name: Scheduled Agent Dispatch ${{ github.event.comment.id }}

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: read

concurrency:
  group: issue-comment-bridge-${{ github.event.comment.id }}
  cancel-in-progress: false

jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - name: Check out authoritative default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Record exact checked-out default-branch revision
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Plan exact correlated machine dispatch decision
        id: handler
        env:
          DEFAULT_BRANCH_REVISION: ${{ steps.revision.outputs.sha }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PYTHONPATH: ${{ github.workspace }}/src
        run: >-
          uv run python -m investment_strategy.issue_comment_bridge
          --event-path "$GITHUB_EVENT_PATH"
          --revision "$DEFAULT_BRANCH_REVISION"
          --github-output "$GITHUB_OUTPUT"
          --result-payload "$RUNNER_TEMP/dispatch-result.json"

      - name: Build plaintext JSON dispatch result
        if: steps.handler.outputs.should_emit == 'true'
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        shell: bash
        run: |
          python - "$RUNNER_TEMP/dispatch-result.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          from investment_strategy.issue_comment_bridge import parse_dispatch_decision

          path = Path(sys.argv[1])
          envelope = json.loads(path.read_text(encoding="utf-8"))
          body = envelope.get("body")
          if not isinstance(body, str):
              raise SystemExit("missing dispatch decision body")
          decision = parse_dispatch_decision(body)
          if decision is None:
              raise SystemExit("invalid dispatch decision body")

          payload = {
              "schema": "scheduled-agent-dispatch-result/v1",
              "request_comment_id": decision.request_comment_id,
              "default_branch_revision": decision.default_branch_revision,
              "disposition": decision.disposition,
          }
          if decision.disposition == "AUTHORIZE":
              if decision.issue_number is None or decision.action is None:
                  raise SystemExit("incomplete AUTHORIZE dispatch result")
              payload["issue_number"] = decision.issue_number
              payload["action"] = decision.action
          else:
              if not isinstance(decision.reason, str) or not decision.reason:
                  raise SystemExit("missing non-authorizing dispatch reason")
              payload["reason"] = decision.reason

          path.write_text(
              json.dumps(payload, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload exact run-scoped machine dispatch result
        if: steps.handler.outputs.should_emit == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: dispatch-result.json
          path: ${{ runner.temp }}/dispatch-result.json
          archive: false
          if-no-files-found: error
          retention-days: 7

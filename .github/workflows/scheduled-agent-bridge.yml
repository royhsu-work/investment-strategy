name: Scheduled Agent Issue Comment Bridge

run-name: Scheduled Agent Dispatch ${{ github.event.comment.id }}

on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: read
  issues: read

concurrency:
  group: issue-comment-bridge-${{ github.event.comment.id }}
  cancel-in-progress: false

jobs:
  bridge:
    runs-on: ubuntu-latest
    outputs:
      quality_target_repository: ${{ steps.handler.outputs.quality_target_repository }}
      quality_target_revision: ${{ steps.handler.outputs.quality_target_revision }}
      quality_definition_revision: ${{ steps.handler.outputs.quality_definition_revision }}
      quality_verification_correlation: ${{ steps.handler.outputs.quality_verification_correlation }}
      quality_source_comment_id: ${{ steps.handler.outputs.quality_source_comment_id }}
      quality_run_id: ${{ steps.handler.outputs.quality_run_id }}
      quality_run_attempt: ${{ steps.handler.outputs.quality_run_attempt }}
      quality_call: ${{ steps.handler.outputs.quality_call }}
      quality_result: ${{ steps.handler.outputs.quality_result }}
      checked_out_revision: ${{ steps.revision.outputs.sha }}
    steps:
      - name: Check out authoritative default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Record exact checked-out default-branch revision
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Plan exact correlated machine dispatch decision
        id: handler
        env:
          DEFAULT_BRANCH_REVISION: ${{ steps.revision.outputs.sha }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PYTHONPATH: ${{ github.workspace }}/src
        run: >-
          uv run python -m investment_strategy.issue_comment_bridge
          --event-path "$GITHUB_EVENT_PATH"
          --revision "$DEFAULT_BRANCH_REVISION"
          --github-output "$GITHUB_OUTPUT"
          --result-payload "$RUNNER_TEMP/dispatch-result.json"
          --repair-admission-payload "$RUNNER_TEMP/runtime-repair-admission.json"

      - name: Upload qualified non-writing Runtime repair admission
        if: steps.handler.outputs.repair_admission == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: runtime-repair-admission.json
          path: ${{ runner.temp }}/runtime-repair-admission.json
          archive: false
          if-no-files-found: error
          retention-days: 7

      - name: Upload exact run-scoped machine dispatch result
        if: steps.handler.outputs.should_emit == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: dispatch-result.json
          path: ${{ runner.temp }}/dispatch-result.json
          archive: false
          if-no-files-found: error
          retention-days: 7

  verify_quality:
    needs: bridge
    if: >-
      ${{ needs.bridge.result == 'success'
      && needs.bridge.outputs.quality_call == 'true'
      && needs.bridge.outputs.quality_result == 'verification-obligation-pending'
      && needs.bridge.outputs.quality_target_repository == github.repository
      && needs.bridge.outputs.quality_target_revision != ''
      && needs.bridge.outputs.quality_verification_correlation != ''
      && needs.bridge.outputs.quality_definition_revision == needs.bridge.outputs.checked_out_revision
      && needs.bridge.outputs.quality_definition_revision == github.workflow_sha
      && needs.bridge.outputs.quality_definition_revision == github.sha
      && needs.bridge.outputs.quality_source_comment_id == format('{0}', github.event.comment.id)
      && needs.bridge.outputs.quality_run_id == github.run_id
      && needs.bridge.outputs.quality_run_attempt == github.run_attempt }}
    permissions:
      contents: read
    uses: ./.github/workflows/quality.yml
    with:
      target_repository: ${{ needs.bridge.outputs.quality_target_repository }}
      target_revision: ${{ needs.bridge.outputs.quality_target_revision }}
      definition_revision: ${{ needs.bridge.outputs.quality_definition_revision }}
      verification_correlation: ${{ needs.bridge.outputs.quality_verification_correlation }}
      source_comment_id: ${{ needs.bridge.outputs.quality_source_comment_id }}
      run_id: ${{ needs.bridge.outputs.quality_run_id }}
      run_attempt: ${{ needs.bridge.outputs.quality_run_attempt }}

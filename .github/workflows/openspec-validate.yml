name: OpenSpec Validate

on:
  push:
    paths:
      - "openspec/**"
      - ".github/workflows/openspec-validate.yml"
  pull_request:
    paths:
      - "openspec/**"
      - ".github/workflows/openspec-validate.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install OpenSpec
        run: npm install -g @fission-ai/openspec@1.3.1

      - name: Show OpenSpec version
        run: openspec --version

      - name: Validate establish-strategy-engine
        run: openspec validate establish-strategy-engine --type change --strict --json --no-interactive

name: OpenSpec Validate

on:
  push:
    paths:
      - "openspec/**"
      - ".github/openspec-version"
      - ".github/scripts/openspec_compatibility.py"
      - ".github/workflows/openspec-validate.yml"
  pull_request:
    paths:
      - "openspec/**"
      - ".github/openspec-version"
      - ".github/scripts/openspec_compatibility.py"
      - ".github/workflows/openspec-validate.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      VALIDATION_TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      VALIDATION_TARGET_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
    steps:
      - name: Checkout validation target
        uses: actions/checkout@v4
        with:
          repository: ${{ env.VALIDATION_TARGET_REPOSITORY }}
          ref: ${{ env.VALIDATION_TARGET_SHA }}

      - name: Verify exact checkout revision
        shell: bash
        run: |
          actual_sha="$(git rev-parse HEAD)"
          echo "validation_target_repository=$VALIDATION_TARGET_REPOSITORY"
          echo "validation_target_sha=$VALIDATION_TARGET_SHA"
          echo "validator_checkout_head=$actual_sha"
          {
            echo "### OpenSpec validation checkout"
            echo "- target repository: \`$VALIDATION_TARGET_REPOSITORY\`"
            echo "- target revision: \`$VALIDATION_TARGET_SHA\`"
            echo "- validator checkout HEAD: \`$actual_sha\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$actual_sha" != "$VALIDATION_TARGET_SHA" ]]; then
            echo "::error::Validator checkout HEAD $actual_sha does not match target $VALIDATION_TARGET_SHA"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install qualified OpenSpec baseline
        shell: bash
        run: |
          openspec_version="$(tr -d '[:space:]' < .github/openspec-version)"
          [[ "$openspec_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::Invalid .github/openspec-version: $openspec_version"
            exit 1
          }
          npm install -g "@fission-ai/openspec@$openspec_version"

      - name: Show OpenSpec version
        run: openspec --version

      - name: Qualify executable compatibility
        run: python .github/scripts/openspec_compatibility.py

      - name: Show active changes
        run: openspec list

      - name: Validate all OpenSpec artifacts
        run: openspec validate --all --strict --json --no-interactive
